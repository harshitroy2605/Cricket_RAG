[project]
name = "third-umpire"
version = "0.0.1"
description = "Cricket RAG + stats agent: historical Q&A, rule book, and evidence-backed claim checking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Phase 0 keeps runtime deps minimal on purpose.
# Each phase adds only what it needs, and its doc explains why.
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
pipeline = [
    "dbt-duckdb>=1.11.1",
]

[tool.uv]
# `uv sync` installs these groups by default. The Docker runtime image will use --no-default-groups.
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/third_umpire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
